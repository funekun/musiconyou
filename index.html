<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みゅーじっく音友</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a1a;min-height:100vh}
header{background:#fff;border-bottom:0.5px solid #e0e0d8;height:56px;position:sticky;top:0;z-index:100}
.main{max-width:860px;margin:0 auto;padding:2rem 1.5rem 10rem}
.tab-content{display:none}.tab-content.active{display:block}
.site-hero{text-align:center;padding:2rem 0 1.5rem;border-bottom:0.5px solid #e8e8e0;margin-bottom:2rem}
.bottom-nav{position:fixed;bottom:72px;left:0;right:0;background:#fff;border-top:0.5px solid #e0e0d8;display:flex;z-index:99}
.bottom-nav button{flex:1;background:none;border:none;cursor:pointer;color:#aaa;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;transition:color .15s}
.bottom-nav button.active{color:#1a1a1a}
.bottom-nav button i{font-size:20px}
.player{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #e0e0d8;padding:0 1.2rem;height:72px;display:flex;align-items:center;gap:10px}
.player-thumb{width:40px;height:40px;border-radius:8px;background:#e8e8e0;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.player-thumb img{width:100%;height:100%;object-fit:cover}
.player-thumb i{font-size:16px;color:#999}
.player-info{min-width:120px;max-width:160px;flex-shrink:0}
.player-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:10px;color:#999}
.player-controls{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ctrl-btn{background:none;border:none;cursor:pointer;color:#888;padding:4px;display:flex;align-items:center;font-size:18px;border-radius:6px}
.ctrl-btn:hover{color:#1a1a1a}
.ctrl-btn.main-ctrl{color:#1a1a1a;font-size:22px}
.progress-area{flex:1;display:flex;align-items:center;gap:6px}
.time{font-size:10px;color:#bbb;min-width:26px}.time.right{text-align:right}
.progress-bar{flex:1;height:3px;background:#e8e8e0;border-radius:2px;cursor:pointer}
.progress-fill{height:100%;background:#1a1a1a;border-radius:2px;pointer-events:none}
.volume-area{display:flex;align-items:center;gap:4px}
.vol-slider{width:50px;height:3px;background:#e8e8e0;border-radius:2px;appearance:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:#1a1a1a}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:2rem;width:90%;max-width:460px;position:relative;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:500;margin-bottom:1.2rem}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:18px;color:#aaa}
.form-row{margin-bottom:1rem}
.form-row label{display:block;font-size:12px;color:#888;margin-bottom:5px}
.form-row input,.form-row textarea{width:100%;border:0.5px solid #e0e0d8;border-radius:8px;padding:8px 11px;font-size:13px;outline:none;background:#f9f9f7;font-family:inherit;resize:vertical}
.form-row input:focus,.form-row textarea:focus{border-color:#888}
.form-row textarea{min-height:64px}
.avatar-pick{display:flex;align-items:center;gap:12px}
.avatar-circle{width:56px;height:56px;border-radius:50%;background:#f0f0ec;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;cursor:pointer;border:1.5px dashed #d0d0c8}
.avatar-circle img{width:100%;height:100%;object-fit:cover}
.avatar-circle i{font-size:20px;color:#ccc}
.btn-primary{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;cursor:pointer;width:100%}
.btn-primary:hover{opacity:.8}
.btn-ghost{background:none;border:0.5px solid #e0e0d8;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;color:#555}
.btn-ghost:hover{background:#f4f4f0}
.follow-btn{border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.follow-btn.following{background:#f0f0ec;color:#555;border:0.5px solid #e0e0d8}
.follow-btn.following:hover{background:#ffe8e8;color:#e24b4a;border-color:#e24b4a}
.follow-btn.not-following{background:#1a1a1a;color:#fff}
.follow-btn.not-following:hover{opacity:.8}
.follow-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto}
.follow-user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:#fafaf8}
.follow-user-av{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#f0f0ec;display:flex;align-items:center;justify-content:center}
.follow-user-av img{width:100%;height:100%;object-fit:cover}
.supa-target{display:flex;align-items:center;gap:10px;background:#f8f8f6;border-radius:10px;padding:10px;margin-bottom:1rem}
.supa-target-thumb,.supa-target-avatar{width:40px;height:40px;background:#e8e8e0;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.supa-target-thumb{border-radius:8px}.supa-target-avatar{border-radius:50%}
.supa-target-thumb img,.supa-target-avatar img{width:100%;height:100%;object-fit:cover}
.supa-target-name{font-size:13px;font-weight:500}
.supa-target-sub{font-size:11px;color:#999}
.amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:.8rem}
.amount-btn{background:#f4f4f0;border:0.5px solid #e0e0d8;border-radius:8px;padding:9px 4px;font-size:12px;cursor:pointer;text-align:center;font-weight:500}
.amount-btn.selected{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.amount-btn small{display:block;font-size:10px;opacity:.65;font-weight:400}
.supa-msg-input{width:100%;border:0.5px solid #e0e0d8;border-radius:8px;padding:7px 11px;font-size:12px;outline:none;background:#f9f9f7;font-family:inherit;margin-bottom:.8rem}
.supa-send-btn{width:100%;padding:9px;border:0.5px solid #e0e0d8;border-radius:8px;font-size:13px;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;background:#f4f4f0;color:#aaa}
.supa-list{margin-top:1rem;border-top:0.5px solid #f0f0ec;padding-top:.8rem}
.supa-list-title{font-size:11px;color:#bbb;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.supa-entries{display:flex;flex-direction:column;gap:5px}
.supa-entry{border-radius:7px;padding:7px 9px;display:flex;align-items:flex-start;gap:7px}
.supa-entry-rank{font-size:11px;font-weight:500;min-width:18px;padding-top:1px}
.supa-entry-av{width:22px;height:22px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.supa-entry-av img{width:100%;height:100%;object-fit:cover}
.supa-entry-body{flex:1;min-width:0}
.supa-entry-top{display:flex;align-items:center;justify-content:space-between;gap:4px}
.supa-entry-name,.supa-entry-pts{font-size:11px;font-weight:500}
.supa-entry-msg{font-size:11px;margin-top:2px;line-height:1.4;word-break:break-word}
.user-hero{background:#fff;border:0.5px solid #e8e8e0;border-radius:12px;padding:1.5rem;margin-bottom:1.2rem}
.user-hero-top{display:flex;align-items:flex-start;gap:1.2rem;flex-wrap:wrap}
.user-avatar-lg{width:80px;height:80px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#f0f0ec;display:flex;align-items:center;justify-content:center}
.user-avatar-lg img{width:100%;height:100%;object-fit:cover}
.user-avatar-lg i{font-size:30px;color:#ccc}
.user-meta{flex:1;min-width:0}
.user-name{font-size:20px;font-weight:500;margin-bottom:4px}
.user-bio{font-size:13px;color:#666;line-height:1.6;margin-bottom:8px}
.user-stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.stat{font-size:12px;color:#888}.stat strong{color:#1a1a1a;font-weight:500}
.stat.clickable{cursor:pointer}.stat.clickable:hover strong{text-decoration:underline}
.supa-btn{background:#fff8e1;border:0.5px solid #f0c040;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:#b8860b;display:inline-flex;align-items:center;gap:4px}
.wall-box{background:#fff;border:0.5px solid #e8e8e0;border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.2rem}
.wall-title{font-size:12px;font-weight:500;color:#888;letter-spacing:.5px;text-transform:uppercase;margin-bottom:.8rem;display:flex;align-items:center;gap:6px}
.wall-comments{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:0;margin-bottom:.8rem}
.wall-comments::-webkit-scrollbar{width:3px}
.wall-comments::-webkit-scrollbar-thumb{background:#e0e0d8;border-radius:2px}
.wall-comment{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid #f4f4f0}
.wall-comment:last-child{border:none}
.wall-av{width:26px;height:26px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#f0f0ec;display:flex;align-items:center;justify-content:center}
.wall-av img{width:100%;height:100%;object-fit:cover}
.wall-body{flex:1;min-width:0}
.wall-uname{font-size:11px;font-weight:500;color:#555}
.wall-text{font-size:12px;color:#333;line-height:1.5;margin-top:1px;word-break:break-word}
.wall-time{font-size:10px;color:#bbb;margin-top:2px}
.wall-input-row{display:flex;gap:7px;align-items:center}
.wall-input{flex:1;border:0.5px solid #e0e0d8;border-radius:20px;padding:6px 12px;font-size:12px;outline:none;background:#f9f9f7;font-family:inherit}
.wall-input:focus{border-color:#888}
.wall-send{background:#1a1a1a;color:#fff;border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:13px}
.wall-empty{font-size:12px;color:#bbb;text-align:center;padding:.8rem 0}
.feed-tabs{display:flex;gap:0;margin-bottom:1.2rem;border-bottom:0.5px solid #e8e8e0}
.feed-tab{background:none;border:none;cursor:pointer;font-size:13px;color:#aaa;padding:8px 16px;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.feed-tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.grid-card{background:#fff;border:0.5px solid #e8e8e0;border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s}
.grid-card:hover{border-color:#ccc}
.grid-card.playing{border-color:#1a1a1a}
.grid-thumb{width:100%;aspect-ratio:1;background:#f0f0ec;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.grid-thumb img{width:100%;height:100%;object-fit:cover}
.grid-thumb i{font-size:30px;color:#ddd}
.grid-ov{position:absolute;inset:0;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;transition:background .15s}
.grid-card:hover .grid-ov,.grid-card.playing .grid-ov{background:rgba(0,0,0,.28)}
.grid-ov i{color:#fff;font-size:26px;opacity:0;transition:opacity .15s}
.grid-card:hover .grid-ov i,.grid-card.playing .grid-ov i{opacity:1}
.grid-info{padding:7px 9px 9px}
.grid-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid-meta{font-size:10px;color:#aaa;margin-top:2px;display:flex;align-items:center;gap:3px}
.upload-zone{background:#fff;border:1.5px dashed #d0d0c8;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;transition:border-color .2s}
.upload-zone.drag{border-color:#888;background:#fafaf8}
.upload-drop{text-align:center;cursor:pointer}
.upload-drop i{font-size:26px;color:#bbb;margin-bottom:6px;display:block}
.upload-drop p{font-size:13px;color:#888;margin-bottom:3px}
.upload-drop small{font-size:11px;color:#bbb}
.pending-files{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:.6rem}
.pending-tag{background:#f0f0ec;border-radius:6px;padding:3px 9px;font-size:11px;color:#666;display:flex;align-items:center;gap:3px}
.pending-tag .rm{cursor:pointer;color:#bbb}.pending-tag .rm:hover{color:#e24b4a}
.upload-section{margin-top:1rem;border-top:0.5px solid #f0f0ec;padding-top:1rem}
.upload-section-title{font-size:11px;color:#999;margin-bottom:6px;text-align:center}
.cat-btns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cat-btn{background:#f4f4f0;border:0.5px solid #e0e0d8;border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;color:#666}
.cat-btn.selected{color:#fff;border-color:transparent}
.thumb-picker{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.thumb-preview{width:56px;height:56px;border-radius:8px;object-fit:cover;display:none}
.thumb-preview.show{display:block}
.thumb-ph{width:56px;height:56px;border-radius:8px;border:1.5px dashed #d0d0c8;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f9f9f7}
.thumb-ph i{font-size:20px;color:#ccc}
.thumb-info{font-size:11px;color:#999}
.thumb-info span{display:block;font-size:10px;color:#bbb;margin-top:1px}
.upload-confirm{display:flex;justify-content:center;margin-top:.8rem}
.upload-confirm button{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:7px 20px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px}
.locked-upload{background:#fff;border:0.5px solid #e8e8e0;border-radius:12px;padding:1.5rem;text-align:center;margin-bottom:1.5rem;color:#aaa}
.locked-upload i{font-size:26px;margin-bottom:6px;display:block}
.locked-upload p{font-size:13px;margin-bottom:10px}
.cat-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500;flex-shrink:0}
.section-title{font-size:12px;font-weight:500;color:#888;letter-spacing:.5px;text-transform:uppercase;margin-bottom:.8rem}
.filter-bar{display:flex;gap:5px;margin-bottom:1rem;flex-wrap:wrap}
.filter-btn{background:#fff;border:0.5px solid #e0e0d8;border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;color:#666}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.track-list{display:flex;flex-direction:column;gap:7px}
.track{background:#fff;border:0.5px solid #e8e8e0;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px;transition:border-color .15s}
.track:hover{border-color:#ccc}
.track.playing{border-color:#d0d0c8;background:#fafaf8}
.track-thumb{width:40px;height:40px;border-radius:7px;flex-shrink:0;background:#f0f0ec;display:flex;align-items:center;justify-content:center;overflow:hidden}
.track-thumb img{width:100%;height:100%;object-fit:cover}
.track-thumb i{font-size:16px;color:#ccc}
.play-btn{width:30px;height:30px;border-radius:50%;background:#1a1a1a;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.play-btn i{color:#fff;font-size:12px;margin-left:1px}
.track-info{flex:1;min-width:0;cursor:pointer}
.track-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-meta{font-size:11px;color:#999;margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.track-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:#bbb;padding:3px;border-radius:5px;display:flex;align-items:center;font-size:15px}
.icon-btn:hover{color:#555;background:#f0f0ec}
.icon-btn.liked{color:#e24b4a}
.like-count,.comment-count{font-size:10px;color:#555;min-width:12px;font-weight:500}
.supa-icon-btn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:5px;font-size:12px;color:#c4980a}
.supa-icon-btn:hover{background:#fff8e1}
.rank-controls{display:flex;gap:6px;margin-bottom:1.2rem;flex-wrap:wrap}
.period-btns{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.period-btns::-webkit-scrollbar{display:none}
.period-btn{background:#fff;border:0.5px solid #e0e0d8;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;color:#888;white-space:nowrap;transition:all .15s;flex-shrink:0}
.period-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}
.rank-list{display:flex;flex-direction:column;gap:7px}
.rank-item{background:#fff;border:0.5px solid #e8e8e0;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.rank-item:hover{border-color:#ccc}
.rank-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.rank-1 .rank-badge{background:#f5e6b0;color:#a07800}
.rank-2 .rank-badge{background:#e4e4e4;color:#666}
.rank-3 .rank-badge{background:#f0ddd0;color:#9a5c30}
.rank-other .rank-badge{background:#f4f4f0;color:#888}
.rank-thumb{width:36px;height:36px;border-radius:6px;flex-shrink:0;background:#f0f0ec;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rank-thumb img{width:100%;height:100%;object-fit:cover}
.rank-thumb i{font-size:14px;color:#ccc}
.rank-info{flex:1;min-width:0}
.rank-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-plays{font-size:11px;color:#999;margin-top:2px;display:flex;align-items:center;gap:5px}
.rank-bar-wrap{flex:1;max-width:100px;height:3px;background:#f0f0ec;border-radius:2px;overflow:hidden}
.rank-bar{height:100%;border-radius:2px;transition:width .4s}
.rank-play-btn{width:26px;height:26px;border-radius:50%;background:#1a1a1a;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rank-play-btn i{color:#fff;font-size:11px;margin-left:1px}
.search-box{position:relative;margin-bottom:1rem}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:#bbb;pointer-events:none}
.search-box input{width:100%;border:0.5px solid #e0e0d8;border-radius:10px;padding:9px 11px 9px 34px;font-size:13px;outline:none;background:#fff;font-family:inherit}
.search-box input:focus{border-color:#888}
.sf-btns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.8rem}
.sf-btn{background:#fff;border:0.5px solid #e0e0d8;border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;color:#666}
.sf-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.search-selects{display:flex;gap:7px;margin-bottom:1rem;flex-wrap:wrap}
.search-selects select{border:0.5px solid #e0e0d8;border-radius:8px;padding:5px 9px;font-size:11px;color:#666;background:#fff;outline:none;cursor:pointer}
.user-result{background:#fff;border:0.5px solid #e8e8e0;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.user-result:hover{border-color:#ccc}
.user-result-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#f0f0ec;display:flex;align-items:center;justify-content:center}
.user-result-av img{width:100%;height:100%;object-fit:cover}
.search-section-lbl{font-size:11px;color:#aaa;letter-spacing:.4px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:4px}
.empty,.empty-rank,.no-results{text-align:center;padding:2.5rem;color:#bbb}
.empty i,.empty-rank i,.no-results i{font-size:36px;margin-bottom:10px;display:block}
.empty p,.empty-rank p,.no-results p{font-size:13px}
.not-registered{text-align:center;padding:3rem 1rem}
.not-registered i{font-size:44px;color:#ddd;margin-bottom:14px;display:block}
.not-registered p{font-size:14px;color:#888;margin-bottom:18px}

async function loadTracks() {
  var res = await sb.from('tracks').select('*').order('created_at', {ascending: false});
  if (res.error || !res.data) return;
  tracks = [];
  for (var i = 0; i < res.data.length; i++) {
    var d = res.data[i];
    var t = {
      id: d.id,
      name: d.name,
      url: d.file_url,
      thumbUrl: d.thumb_url,
      cat: d.cat || 'other',
      isVideo: d.is_video,
      uploader: d.uploader_name,
      uploader_id: d.uploader_id,
      duration: d.duration || 0,
      createdAt: d.created_at || null,
      description: d.description || '',
      tags: d.tags || '',
      youtubeUrl: d.youtube_url || ''
    };
    tracks.push(t);
    commentsData[t.id] = commentsData[t.id] || [];
    plays[t.id] = {daily:0,weekly:0,monthly:0,yearly:0,alltime:0};
    supaTrack[t.id] = supaTrack[t.id] || [];
  }

  // play_countsから再生数を集計
  var now = new Date();
  var dayAgo   = new Date(now - 86400000).toISOString();
  var weekAgo  = new Date(now - 86400000*7).toISOString();
  var monthAgo = new Date(now - 86400000*30).toISOString();
  var yearAgo  = new Date(now - 86400000*365).toISOString();
  var pcRes = await sb.from('play_counts').select('track_id, played_at');
  if (!pcRes.error && pcRes.data) {
    for (var j = 0; j < pcRes.data.length; j++) {
      var pc = pcRes.data[j]; var tid = pc.track_id; var pt = pc.played_at;
      if (!plays[tid]) plays[tid] = {daily:0,weekly:0,monthly:0,yearly:0,alltime:0};
      plays[tid].alltime++;
      if (pt >= yearAgo)  plays[tid].yearly++;
      if (pt >= monthAgo) plays[tid].monthly++;
      if (pt >= weekAgo)  plays[tid].weekly++;
      if (pt >= dayAgo)   plays[tid].daily++;
    }
  }

  // likesをDBから取得
  var likesRes = await sb.from('likes').select('track_id, user_id');
  if (!likesRes.error && likesRes.data) {
    // いいね数をカウント
    for (var k = 0; k < likesRes.data.length; k++) {
      var lk = likesRes.data[k];
      likes[lk.track_id] = (likes[lk.track_id] || 0) + 1;
    }
    // 自分がいいねしたかどうかをboolに上書き（表示用）
    if (currentAuthUser) {
      var myLikes = {};
      for (var k = 0; k < likesRes.data.length; k++) {
        if (likesRes.data[k].user_id === currentAuthUser.id) myLikes[likesRes.data[k].track_id] = 1;
      }
      // likes[id]を「自分がいいねしたか」で上書き（カウントは別途renderで使う）
      window._likeCounts = likes;
      window._myLikes = myLikes;
      likes = myLikes;
    }
  }

  renderTracks(); renderRanking(); renderFilterBar(); renderUserPage();
}

async function loadUserProfile(authUser) {
  var res = await sb.from('profiles').select('*').eq('id', authUser.id).single();
  if (res.data) {
    user = {
      id: authUser.id,
      name: res.data.name,
      bio: res.data.bio || '',
      avatarUrl: res.data.avatar_url || null
    };
  } else {
    // プロフィール未作成の場合は登録モーダルを開く
    user = {id: authUser.id, name: '', bio: '', avatarUrl: null};
    openRegModal(false);
  }
  // フォロー情報をDBから読み込む
  var fRes = await sb.from('follows').select('following_id, profiles!follows_following_id_fkey(name)').eq('follower_id', authUser.id);
  if (!fRes.error && fRes.data) {
    following = {};
    for (var i = 0; i < fRes.data.length; i++) {
      var fname = fRes.data[i].profiles && fRes.data[i].profiles.name;
      if (fname) following[fname] = true;
    }
  }
  updateNavUser();
  renderUploadArea();
  renderUserPage();
  renderTracks();
  loadTracks();
  loadNotifications();
  // 30秒ごとに通知を再チェック
  if (window._notifInterval) clearInterval(window._notifInterval);
  window._notifInterval = setInterval(loadNotifications, 30000);
}

async function authSubmit() {
  var email = document.getElementById('auth-email').value.trim();
  var password = document.getElementById('auth-password').value.trim();
  var errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'メールとパスワードを入力してください'; return; }
  if (password.length < 6) { errEl.textContent = 'パスワードは6文字以上にしてください'; return; }

  document.getElementById('auth-submit-btn').textContent = '処理中...';
  document.getElementById('auth-submit-btn').disabled = true;

  var res;
  if (authMode === 'login') {
    res = await sb.auth.signInWithPassword({email: email, password: password});
  } else {
    res = await sb.auth.signUp({email: email, password: password});
  }

  document.getElementById('auth-submit-btn').disabled = false;
  document.getElementById('auth-submit-btn').textContent = authMode === 'login' ? 'ログイン' : '登録する';

  if (res.error) {
    var msg = res.error.message;
    if (msg.indexOf('Invalid login') >= 0) msg = 'メールアドレスまたはパスワードが違います';
    if (msg.indexOf('already registered') >= 0) msg = 'このメールアドレスはすでに登録済みです';
    if (msg.indexOf('weak') >= 0) msg = 'パスワードが弱すぎます';
    errEl.textContent = msg;
  } else if (authMode === 'signup' && res.data && !res.data.session) {
    errEl.style.color = '#2e7d32';
    errEl.textContent = '確認メールを送りました。メールを確認してください。';
  }
}

function toggleNotifPanel() {

  document.getElementById('comments-panel').classList.remove('open');
  if (notifOpen) {
    renderNotifPanel();
  }
}

function renderNotifPanel() {
  var body = document.getElementById('notif-body');
  if (!notifications.length) {
    body.innerHTML = '<div class="notif-empty"><i class="ti ti-bell-off"></i><p>通知はまだありません</p></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < notifications.length; i++) {
    var n = notifications[i];
    var iconClass = n.type === 'like' ? 'like' : (n.type === 'comment' ? 'comment' : 'follow');
    var iconName = n.type === 'like' ? 'ti-heart-filled' : (n.type === 'comment' ? 'ti-message' : 'ti-user-plus');
    var thumbHtml2 = n.track_thumb
      ? '<div class="notif-thumb"><img src="' + n.track_thumb + '"></div>'
      : '<div class="notif-thumb"><i class="ti ti-music"></i></div>';
    var timeStr = n.created_at ? new Date(n.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    var onclick = n.track_id ? 'onNotifClick(\'' + n.id + '\',\'' + n.track_id + '\')' : 'onNotifClick(\'' + n.id + '\',null)';
    html += '<div class="notif-item' + (n.is_read ? '' : ' unread') + '" onclick="' + onclick + '">' +
      '<div class="notif-icon ' + iconClass + '"><i class="ti ' + iconName + '"></i></div>' +
      '<div class="notif-content">' +
        '<div class="notif-text">' + n.message + '</div>' +
        '<div class="notif-time">' + timeStr + '</div>' +
      '</div>' +
      (n.track_id ? thumbHtml2 : '') +
    '</div>';
  }
  body.innerHTML = html;
}

  }
  updateNotifBadge();
  renderNotifPanel();
  // 該当トラックへジャンプ
  if (trackId) {
    toggleNotifPanel();
    switchTab('feed');
    var idx = -1;
    for (var i = 0; i < tracks.length; i++) if (tracks[i].id === trackId) { idx = i; break; }

        var el = document.getElementById('track-' + trackId);

      }, 300);
    }
  }

function fmtDate(dateStr) {

  var D = d.getDate();
  var h = d.getHours();
  var m = ('0' + d.getMinutes()).slice(-2);

function fmtTime(s) {

function isFollowing(name) { return !!following[name]; }
async function toggleFollow(name) {
  if (!user) { showToast('フォローにはユーザー登録が必要です'); return; }
  if (name === user.name) { showToast('自分はフォローできません'); return; }
  if (!currentAuthUser) { showToast('ログインが必要です'); return; }
  // フォロー対象のuser_idをprofilesから取得
  var profRes = await sb.from('profiles').select('id').eq('name', name).single();
  if (profRes.error || !profRes.data) { showToast('ユーザーが見つかりません'); return; }
  var targetId = profRes.data.id;
  if (following[name]) {
    await sb.from('follows').delete().eq('follower_id', currentAuthUser.id).eq('following_id', targetId);
    following[name] = false;
    followerCounts[name] = Math.max(0, (followerCounts[name] || 1) - 1);
    showToast(name + ' のフォローを解除しました');
  } else {
    await sb.from('follows').insert({ follower_id: currentAuthUser.id, following_id: targetId });
    following[name] = true;
    followerCounts[name] = (followerCounts[name] || 0) + 1;
    showToast(name + ' をフォローしました！');
  }
  renderTracks(); renderUserPage();
}

        '</div>' +
        '<div class="upload-section">' +
          '<div class="upload-section-title">紹介文（任意）</div>' +
          '<textarea id="track-desc-input" placeholder="曲の紹介文を書いてください..." rows="3" style="width:100%;padding:8px 12px;border:1px solid #e0e0d8;border-radius:8px;font-size:13px;box-sizing:border-box;outline:none;resize:vertical;font-family:inherit"></textarea>' +
        '</div>' +
        '<div class="upload-section">' +
          '<div class="upload-section-title">タグ（任意）</div>' +
          '<input type="text" id="track-tags-input" placeholder="#歌ってみた #アニメ #ボカロ （スペース区切り）" style="width:100%;padding:8px 12px;border:1px solid #e0e0d8;border-radius:8px;font-size:13px;box-sizing:border-box;outline:none">' +
        '</div>' +
        '<div style="text-align:center;font-size:11px;color:#e8928a;margin-bottom:6px">⚠️ 著作権に抵触する楽曲は削除します</div>' +
        '<div class="upload-confirm"><button onclick="confirmUpload()"><i class="ti ti-upload"></i> アップロード</button></div>' +
      '</div>' +
    '</div>';

  // イベントリスナーを直接設定
  document.getElementById('file-input').addEventListener('change', function() {

  });
  document.getElementById('thumb-input').addEventListener('change', function() {

}
function onFileSelect(files) {
  pendingFiles = [];
  for (var i = 0; i < files.length; i++) {
    if (files[i].type.indexOf('audio/') === 0 || files[i].type.indexOf('video/') === 0) pendingFiles.push(files[i]);
  }
  if (!pendingFiles.length) { showToast('対応していないファイル形式です'); return; }
  renderPendingFiles();
  var opts = document.getElementById('upload-options');
  if (opts) {
    opts.style.display = 'block';
    renderCatBtns();
  } else {
    // upload-optionsが見つからない場合はエリアを再描画
    renderUploadArea();
    setTimeout(function() {
      renderPendingFiles();
      var opts2 = document.getElementById('upload-options');
      if (opts2) { opts2.style.display = 'block'; renderCatBtns(); }
    }, 100);
  }
}
function renderPendingFiles() {
  var html = '';
  for (var i = 0; i < pendingFiles.length; i++) {
    var nm = pendingFiles[i].name.replace(/\.[^.]+$/, '');
    html += '<div class="pending-tag"><i class="ti ti-' + (isVid(pendingFiles[i]) ? 'video' : 'music') + '" style="font-size:10px;color:#aaa"></i>' + nm + '<span class="rm" onclick="removePending(' + i + ')"><i class="ti ti-x"></i></span></div>';
  }
  document.getElementById('pending-files').innerHTML = html;
}
function removePending(i) {
  pendingFiles.splice(i, 1);
  if (!pendingFiles.length) { document.getElementById('upload-options').style.display = 'none'; document.getElementById('pending-files').innerHTML = ''; }
  else renderPendingFiles();
}
function renderCatBtns() {
  var html = '';
  for (var i = 0; i < CATS.length; i++) {
    var c = CATS[i]; var sel = pendingCat === c.id;
    html += '<button class="cat-btn' + (sel ? ' selected' : '') + '" onclick="selectCat(\'' + c.id + '\')" style="' + (sel ? 'background:' + c.color + ';border-color:' + c.color : '') + '">' + c.label + '</button>';
  }

}
function selectCat(id) { pendingCat = id; renderCatBtns(); }
function onThumbSelect(inp) {
  var f = inp.files[0]; if (!f) return;
  if (pendingThumbUrl) URL.revokeObjectURL(pendingThumbUrl);
  pendingThumbUrl = URL.createObjectURL(f);
  var p = document.getElementById('thumb-preview'); p.src = pendingThumbUrl; p.classList.add('show');
  document.getElementById('thumb-ph').style.display = 'none';
  document.getElementById('thumb-name').textContent = f.name.length > 18 ? f.name.slice(0,16) + '…' : f.name;
  document.getElementById('thumb-clear').style.display = 'inline';
}
function clearThumb() {
  if (pendingThumbUrl) URL.revokeObjectURL(pendingThumbUrl); pendingThumbUrl = null;
  var p = document.getElementById('thumb-preview'); p.classList.remove('show'); p.src = '';
  document.getElementById('thumb-ph').style.display = 'flex';
  document.getElementById('thumb-name').textContent = '画像を選んでください';
  document.getElementById('thumb-clear').style.display = 'none';
  document.getElementById('thumb-input').value = '';
}
async function confirmUpload() {
  if (!pendingFiles.length && !document.getElementById('track-youtube-input')?.value.trim()) return;
  if (!pendingCat) { showToast('カテゴリーを選択してください'); return; }
  if (!currentAuthUser) { showToast('ログインが必要です'); return; }
  // 著作権モードの場合はYouTubeURLが必須
  if (window._uploadMode === 'copyright') {
    var ytCheck = document.getElementById('track-youtube-input')?.value.trim();
    if (!ytCheck || !extractYoutubeId(ytCheck)) { showToast('著作権のある曲はYouTubeURLを入力してください'); return; }
    if (pendingFiles.length) { showToast('著作権のある曲はファイルアップロードできません'); return; }
  }

  // ボタンを無効化してアップロード中を表示
  var uploadBtn = document.querySelector('.upload-confirm button');
  if (uploadBtn) { uploadBtn.disabled = true; uploadBtn.innerHTML = '<i class="ti ti-loader"></i> アップロード中...'; }
  showToast('アップロード中... しばらくお待ちください');

  var thumbFile = document.getElementById('thumb-input') && document.getElementById('thumb-input').files[0] || null;
  var cat = pendingCat;
  var filesToUpload = pendingFiles.slice();
  // タイトル・紹介文・タグ・YouTubeURLをここで取得（ループ前に）
  var titleInput = document.getElementById('track-title-input');
  var customTitle = titleInput ? titleInput.value.trim() : '';
  var descInput = document.getElementById('track-desc-input');
  var customDesc = descInput ? descInput.value.trim() : '';
  var tagsInput = document.getElementById('track-tags-input');
  var customTags = tagsInput ? tagsInput.value.trim() : '';
  var youtubeInput = document.getElementById('track-youtube-input');
  var youtubeUrl = youtubeInput ? youtubeInput.value.trim() : '';
  var youtubeId = youtubeUrl ? extractYoutubeId(youtubeUrl) : '';

  // YouTubeURLだけの投稿（ファイルなし）
  if (youtubeId && !pendingFiles.length) {
    if (!pendingCat) { showToast('カテゴリーを選択してください'); return; }
    var ytTitle = customTitle || 'YouTube動画';
    var insertRes = await sb.from('tracks').insert({
      name: ytTitle,
      file_url: null,
      thumb_url: 'https://img.youtube.com/vi/' + youtubeId + '/mqdefault.jpg',
      cat: cat,
      is_video: true,
      uploader_name: user.name,
      uploader_id: currentAuthUser.id,
      duration: 0,
      description: customDesc || null,
      tags: customTags || null,
      youtube_url: youtubeUrl
    });
    if (!insertRes.error) {
      showToast('🎬 YouTube動画を投稿しました！');
      pendingFiles = []; pendingCat = null; pendingThumbUrl = null;
      var opts = document.getElementById('upload-options');
      if (opts) opts.style.display = 'none';
      var pf = document.getElementById('pending-files');
      if (pf) pf.innerHTML = '';
      var fi = document.getElementById('file-input');
      if (fi) fi.value = '';
      var yi = document.getElementById('track-youtube-input');
      if (yi) yi.value = '';
      document.getElementById('youtube-preview').style.display = 'none';
      var ti = document.getElementById('track-title-input');
      if (ti) ti.value = '';
      var di = document.getElementById('track-desc-input');
      if (di) di.value = '';
      var tgi = document.getElementById('track-tags-input');
      if (tgi) tgi.value = '';
      clearThumb();
      await loadTracks();
    } else {
      showToast('投稿に失敗しました');
    }
    if (uploadBtn) { uploadBtn.disabled = false; uploadBtn.innerHTML = '<i class="ti ti-upload"></i> アップロード'; }
    return;
  }

  // サムネイルを先にアップロード（全曲共通）
  var finalThumbUrl = null;
  if (thumbFile) {
    var thumbExt = thumbFile.name.split('.').pop();
    var thumbPath = currentAuthUser.id + '/' + uid() + '.' + thumbExt;
    var thumbRes = await sb.storage.from('thumbnails').upload(thumbPath, thumbFile, { upsert: true });
    if (!thumbRes.error) {
      finalThumbUrl = sb.storage.from('thumbnails').getPublicUrl(thumbPath).data.publicUrl;
    }
  }

  var successCount = 0;
  var failCount = 0;

  for (var i = 0; i < filesToUpload.length; i++) {
    var f = filesToUpload[i];
    try {
      // 1. 音声/動画ファイルをStorageにアップロード
      var ext = f.name.split('.').pop();
      var filePath = currentAuthUser.id + '/' + uid() + '.' + ext;
      var fileRes = await sb.storage.from('tracks').upload(filePath, f, { upsert: true });
      if (fileRes.error) { failCount++; continue; }
      var fileUrl = sb.storage.from('tracks').getPublicUrl(filePath).data.publicUrl;

      // 2. 曲の長さを取得
      var duration = await new Promise(function(resolve) {
        var tmp = f.type.indexOf('video/') === 0 ? document.createElement('video') : new Audio();
        tmp.src = URL.createObjectURL(f);
        tmp.onloadedmetadata = function() { resolve(tmp.duration || 0); };
        tmp.onerror = function() { resolve(0); };
        setTimeout(function() { resolve(0); }, 5000); // 5秒タイムアウト
      });

      // 3. tracksテーブルにinsert
      var trackName = customTitle ? customTitle : f.name.replace(/\.[^.]+$/, '');
      var insertRes = await sb.from('tracks').insert({
        name: trackName,
        file_url: fileUrl,
        thumb_url: finalThumbUrl,
        cat: cat,
        is_video: f.type.indexOf('video/') === 0,
        uploader_name: user.name,
        uploader_id: currentAuthUser.id,
        duration: Math.round(duration),
        description: customDesc || null,
        tags: customTags || null,
        youtube_url: youtubeId ? youtubeUrl : null
      });

      if (insertRes.error) { failCount++; continue; }
      successCount++;
    } catch(e) {
      failCount++;
    }
  }

  // リセット
  pendingFiles = []; pendingCat = null; pendingThumbUrl = null;
  var opts = document.getElementById('upload-options');
  if (opts) opts.style.display = 'none';
  var pf = document.getElementById('pending-files');
  if (pf) pf.innerHTML = '';
  var fi = document.getElementById('file-input');
  if (fi) fi.value = '';
  var ti = document.getElementById('track-title-input');
  if (ti) ti.value = '';
  var di = document.getElementById('track-desc-input');
  if (di) di.value = '';
  var tgi = document.getElementById('track-tags-input');
  if (tgi) tgi.value = '';
  var yi = document.getElementById('track-youtube-input');
  if (yi) yi.value = '';
  var yp = document.getElementById('youtube-preview');
  if (yp) yp.style.display = 'none';
  clearThumb();

  // 結果を表示してDBから再読み込み
  if (failCount === 0) {
    showToast('🎵 ' + successCount + '曲をアップロードしました！');
  } else if (successCount > 0) {
    showToast(successCount + '曲成功、' + failCount + '曲失敗しました');
  } else {
    showToast('アップロードに失敗しました。Storageの設定を確認してください');
  }

  await loadTracks(); // DBから最新データを再取得
}

function renderTracks() {
  var list = document.getElementById('track-list');
  var src = tracks;
  if (feedTab === 'follow') {
    var fl = followingList();
    src = [];
    for (var i = 0; i < tracks.length; i++) {
      for (var j = 0; j < fl.length; j++) if (fl[j] === tracks[i].uploader) { src.push(tracks[i]); break; }
    }
  }
  var filtered = feedFilter === 'all' ? src : [];
  if (feedFilter !== 'all') for (var i = 0; i < src.length; i++) if (src[i].cat === feedFilter) filtered.push(src[i]);
  if (!filtered.length) {
    list.innerHTML = '<div class="empty"><i class="ti ti-music-off"></i><p>' + (feedTab === 'follow' ? 'フォロー中のユーザーの投稿がありません' : 'まだ曲がありません') + '</p></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < filtered.length; i++) html += trackRowHtml(filtered[i], tracks.indexOf(filtered[i]));
  list.innerHTML = html;
}

/* ---- ranking ---- */
var PERIOD_LABELS = { daily: '今日', weekly: '今週', monthly: '今月', alltime: '全期間' };
var PERIOD_KEY    = { daily: 'daily', weekly: 'weekly', monthly: 'monthly', alltime: 'alltime' };

function calcScore(t) {
  var key = PERIOD_KEY[currentPeriod] || 'alltime';
  var playPts = (plays[t.id]||{})[key] || 0;
  var likePts = ((window._likeCounts && window._likeCounts[t.id]) || 0) * 5;
  var supaPts = totalPts(supaTrack[t.id] || []) * 50;
  return playPts + likePts + supaPts;
}
function calcPlayForPeriod(t) {
  var key = PERIOD_KEY[currentPeriod] || 'alltime';
  return (plays[t.id]||{})[key] || 0;
}
function renderRankBlock(src, label, color) {
  if (!src.length) return '';
  var sorted = [];
  for (var i = 0; i < src.length; i++) sorted.push({t:src[i], score:calcScore(src[i]), play:calcPlayForPeriod(src[i])});
  sorted.sort(function(a,b){ return b.score - a.score; });
  var max = sorted[0].score || 1;
  var medals = ['🥇','🥈','🥉'];
  var rankColors = ['#f5c400','#aaa','#cd7f32'];
  var rows = '';
  for (var i = 0; i < sorted.length; i++) {
    var t = sorted[i].t; var cnt = sorted[i].score; var pPlay = sorted[i].play;
    var ci = catInfo(t.cat);
    var tIdx = tracks.indexOf(t); var spPts = totalPts(supaTrack[t.id]);
    var lk = (window._likeCounts && window._likeCounts[t.id]) || 0;
    var rowStyle = '';
    if (i === 0) rowStyle = 'background:linear-gradient(90deg,#fffbea 0%,#fff 100%);border-left:3px solid #f5c400';
    else if (i === 1) rowStyle = 'background:linear-gradient(90deg,#f6f6f6 0%,#fff 100%);border-left:3px solid #aaa';
    else if (i === 2) rowStyle = 'background:linear-gradient(90deg,#fff5f0 0%,#fff 100%);border-left:3px solid #cd7f32';
    var badgeStyle = i < 3
      ? 'font-size:15px;font-weight:700;color:' + rankColors[i] + ';min-width:22px;text-align:center'
      : 'font-size:11px;font-weight:600;color:#bbb;min-width:22px;text-align:center';
    rows += '<div class="rank-item ' + (i < 3 ? 'rank-' + (i+1) : 'rank-other') + '" style="' + rowStyle + '" onclick="playTrack(' + tIdx + ')">' +
      '<div class="rank-badge"><span style="' + badgeStyle + '">' + (i+1) + '</span></div>' +
      '<div class="rank-thumb">' + thumbHtml(t, 36) + '</div>' +
      '<div class="rank-info">' +
        '<div class="rank-title">' + esc(t.name) + '</div>' +
        '<div class="rank-plays">' +
          (color !== '#888' ? '' : '<span class="cat-badge" style="background:' + ci.bg + ';color:' + ci.color + '">' + ci.label + '</span>') +
          '<span><i class="ti ti-player-play" style="font-size:9px"></i> ' + pPlay + '再生</span>' +
          '<span style="color:#e24b4a">♥' + lk + '</span>' +
          '<span style="color:#888;font-weight:500">' + cnt + 'pt</span>' +
          (spPts > 0 ? '<span style="color:#c4980a">🪙' + spPts + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="rank-bar-wrap"><div class="rank-bar" style="width:' + Math.round(cnt/max*100) + '%;background:' + color + '"></div></div>' +
      '<button class="rank-play-btn" onclick="event.stopPropagation();playTrack(' + tIdx + ')"><i class="ti ti-player-play"></i></button>' +
    '</div>';
  }
  return '<div style="margin-bottom:1.5rem">' +
    '<div style="display:flex;align-items:center;gap:6px;margin-bottom:.6rem">' +
    (color !== '#888'
      ? '<span style="width:9px;height:9px;border-radius:50%;background:' + color + ';display:inline-block"></span>'
      : '<i class="ti ti-list-numbers" style="font-size:13px;color:#888"></i>') +
    '<span style="font-size:12px;font-weight:500;color:' + color + '">' + label + '</span>' +
    '<span style="font-size:10px;color:#bbb">' + src.length + '曲</span>' +
    '</div>' +
    '<div class="rank-list">' + rows + '</div></div>';
}
function setRankCat(v) { rankCat = v; renderRanking(); }
function setRankGenre(v) { rankGenre = v; renderRanking(); }

function renderRanking() {
  // 期間ラベルを更新
  var periodLabel = document.getElementById('rank-period-label');
  if (periodLabel) periodLabel.textContent = (PERIOD_LABELS[currentPeriod] || '') + 'のランキング';

  // セレクトの選択肢を更新
  var catSel = document.getElementById('rank-cat-select');
  var genSel = document.getElementById('rank-genre-select');
  if (catSel) {
    var catHtml = '<option value="">カテゴリーを絞る</option>';
    for (var i = 0; i < CATS.length; i++) catHtml += '<option value="' + CATS[i].id + '">' + CATS[i].label + '</option>';
    catSel.innerHTML = catHtml; catSel.value = rankCat;
  }
  if (genSel) {
    var genHtml = '<option value="">ジャンルを絞る</option>';
    for (var i = 0; i < GENRES.length; i++) genHtml += '<option value="' + GENRES[i] + '">' + GENRES[i] + '</option>';
    genSel.innerHTML = genHtml; genSel.value = rankGenre;
  }

  var sections = document.getElementById('rank-sections');
  if (!tracks.length) { sections.innerHTML = '<div class="empty-rank"><i class="ti ti-trophy"></i><p>曲をアップロードするとランキングが表示されます</p></div>'; return; }

  if (rankCat || rankGenre) {
    var filtered = tracks.filter(function(t) {
      return (!rankCat || t.cat === rankCat) && (!rankGenre || t.genre === rankGenre);
    });
    var lbl = '';
    if (rankCat) { var ci = catInfo(rankCat); lbl = ci.label + 'ランキング'; }
    if (rankGenre) lbl += (lbl ? ' / ' : '') + rankGenre + 'ランキング';
    sections.innerHTML = filtered.length
      ? renderRankBlock(filtered, lbl, rankCat ? catInfo(rankCat).color : '#3a8fb5')
      : '<div class="empty-rank"><i class="ti ti-trophy"></i><p>この条件の曲がありません</p></div>';
    return;
  }

  var used = {};
  for (var i = 0; i < tracks.length; i++) used[tracks[i].cat] = true;
  // 総合ランキングのみ表示
  sections.innerHTML = renderRankBlock(tracks, '総合ランキング', '#888');
}

function renderStatsTab(myTracks) {
  if (!myTracks.length) {
    return '<div class="empty"><i class="ti ti-chart-bar"></i><p>曲を投稿すると統計が表示されます</p></div>';
  }

  // 集計
  var totalPlay = 0, totalLike = 0, totalCmt = 0, totalSupa = 0;
  for (var i = 0; i < myTracks.length; i++) {
    var t = myTracks[i];
    totalPlay += (plays[t.id] || {}).alltime || 0;
    totalLike += (window._likeCounts && window._likeCounts[t.id]) || 0;
    totalCmt  += (commentsData[t.id] || []).length;
    totalSupa += totalPts(supaTrack[t.id] || []);
  }

  // サマリーカード
  var cards =
    '<div class="stat-cards">' +
      '<div class="stat-card"><div class="stat-card-label"><i class="ti ti-player-play" style="font-size:11px"></i>総再生数</div><div class="stat-card-val">' + totalPlay + '</div><div class="stat-card-sub">累計</div></div>' +
      '<div class="stat-card"><div class="stat-card-label"><i class="ti ti-heart" style="font-size:11px;color:#e24b4a"></i>総いいね</div><div class="stat-card-val" style="color:#e24b4a">' + totalLike + '</div><div class="stat-card-sub">累計</div></div>' +
      '<div class="stat-card"><div class="stat-card-label"><i class="ti ti-message" style="font-size:11px;color:#4455cc"></i>総コメント</div><div class="stat-card-val" style="color:#4455cc">' + totalCmt + '</div><div class="stat-card-sub">累計</div></div>' +
      '<div class="stat-card"><div class="stat-card-label"><i class="ti ti-coin" style="font-size:11px;color:#c4980a"></i>投げ銭pt</div><div class="stat-card-val" style="color:#c4980a">' + totalSupa + '</div><div class="stat-card-sub">累計</div></div>' +
    '</div>';

  // 再生数ランキング（横棒グラフ）
  var sorted = myTracks.slice().sort(function(a,b){ return ((plays[b.id]||{}).alltime||0) - ((plays[a.id]||{}).alltime||0); });
  var maxPlay = Math.max(1, (plays[sorted[0].id]||{}).alltime||0);
  var playBars = '';
  for (var i = 0; i < Math.min(sorted.length, 6); i++) {
    var t = sorted[i];
    var cnt = (plays[t.id]||{}).alltime||0;
    var pct = Math.round(cnt / maxPlay * 100);
    var ci = catInfo(t.cat);
    playBars += '<div class="bar-row">' +
      '<div class="bar-label">' + esc(t.name) + '</div>' +
      '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%;background:' + ci.color + '"></div></div>' +
      '<div class="bar-val">' + cnt + '</div></div>';
  }
  var playChart = '<div class="stats-section"><div class="stats-section-title"><i class="ti ti-player-play" style="font-size:12px"></i>曲別 再生数</div><div class="bar-chart">' + playBars + '</div></div>';

  // いいねランキング（横棒グラフ）
  var sortedL = myTracks.slice().sort(function(a,b){ return ((window._likeCounts&&window._likeCounts[b.id])||0) - ((window._likeCounts&&window._likeCounts[a.id])||0); });
  var maxLike = Math.max(1, (window._likeCounts&&window._likeCounts[sortedL[0].id])||0);
  var likeBars = '';
  for (var i = 0; i < Math.min(sortedL.length, 6); i++) {
    var t = sortedL[i];
    var lc = (window._likeCounts&&window._likeCounts[t.id])||0;
    var pct2 = Math.round(lc / maxLike * 100);
    likeBars += '<div class="bar-row">' +
      '<div class="bar-label">' + esc(t.name) + '</div>' +
      '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct2 + '%;background:#e24b4a"></div></div>' +
      '<div class="bar-val">' + lc + '</div></div>';
  }
  var likeChart = '<div class="stats-section"><div class="stats-section-title"><i class="ti ti-heart" style="font-size:12px;color:#e24b4a"></i>曲別 いいね数</div><div class="bar-chart">' + likeBars + '</div></div>';

  // カテゴリー内訳（SVGドーナツ）
  var catCount = {};
  for (var i = 0; i < myTracks.length; i++) { var cat = myTracks[i].cat; catCount[cat] = (catCount[cat]||0) + 1; }
  var donutHtml = renderDonut(catCount, myTracks.length);

  // 曲別パフォーマンス表
  var tableRows = '';
  var sortedAll = myTracks.slice().sort(function(a,b){ return ((plays[b.id]||{}).alltime||0) - ((plays[a.id]||{}).alltime||0); });
  for (var i = 0; i < sortedAll.length; i++) {
    var t = sortedAll[i];
    var pl = (plays[t.id]||{}).alltime||0;
    var lk = (window._likeCounts&&window._likeCounts[t.id])||0;
    var cm = (commentsData[t.id]||[]).length;
    var sp = totalPts(supaTrack[t.id]||[]);
    var ci = catInfo(t.cat);
    tableRows += '<div class="track-stat-row">' +
      '<div class="track-stat-thumb">' + (t.thumbUrl ? '<img src="' + t.thumbUrl + '">' : '<i class="ti ti-music" style="font-size:13px;color:#ccc"></i>') + '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="track-stat-name">' + esc(t.name) + '</div>' +
        '<span class="cat-badge" style="background:' + ci.bg + ';color:' + ci.color + ';font-size:9px">' + ci.label + '</span>' +
      '</div>' +
      '<div class="track-stat-nums">' +
        '<div class="track-stat-num"><i class="ti ti-player-play" style="font-size:9px"></i>' + pl + '</div>' +
        '<div class="track-stat-num" style="color:#e24b4a"><i class="ti ti-heart" style="font-size:9px"></i>' + lk + '</div>' +
        '<div class="track-stat-num" style="color:#4455cc"><i class="ti ti-message" style="font-size:9px"></i>' + cm + '</div>' +
        (sp > 0 ? '<div class="track-stat-num" style="color:#c4980a">🪙' + sp + '</div>' : '') +
      '</div>' +
    '</div>';
  }
  var tableSection = '<div class="stats-section"><div class="stats-section-title"><i class="ti ti-table" style="font-size:12px"></i>曲別パフォーマンス</div>' + tableRows + '</div>';

  return cards + playChart + likeChart + donutHtml + tableSection;
}

function renderDonut(catCount, total) {
  if (!total) return '';
  var cats = [];
  for (var k in catCount) { var ci = catInfo(k); cats.push({id:k, label:ci.label, color:ci.color, count:catCount[k]}); }
  cats.sort(function(a,b){ return b.count - a.count; });

  // SVG donut
  var cx = 54, cy = 54, r = 40, stroke = 18;
  var circumference = 2 * Math.PI * r;
  var offset = 0;
  var slices = '';
  for (var i = 0; i < cats.length; i++) {
    var pct = cats[i].count / total;
    var dash = pct * circumference;
    var gap  = circumference - dash;
    slices += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + cats[i].color + '" stroke-width="' + stroke + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + gap.toFixed(2) + '" stroke-dashoffset="-' + offset.toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    offset += dash;
  }
  var svgHtml = '<svg width="108" height="108" viewBox="0 0 108 108" style="flex-shrink:0">' + slices +
    '<text x="54" y="50" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">' + total + '</text>' +
    '<text x="54" y="64" text-anchor="middle" font-size="9" fill="#bbb">曲</text>' +
    '</svg>';

  var legendHtml = '<div class="donut-legend">';
  for (var i = 0; i < cats.length; i++) {
    legendHtml += '<div class="donut-legend-item"><div class="donut-dot" style="background:' + cats[i].color + '"></div>' +
      '<span>' + cats[i].label + '</span><span style="margin-left:auto;font-weight:500;color:#1a1a1a">' + cats[i].count + '曲</span></div>';
  }
  legendHtml += '</div>';

  return '<div class="stats-section"><div class="stats-section-title"><i class="ti ti-chart-donut" style="font-size:12px"></i>カテゴリー内訳</div>' +
    '<div class="donut-wrap">' + svgHtml + legendHtml + '</div></div>';
}

function onSearchInput(v) { searchQuery = v; runSearch(); }
function searchByTag(tag) {
  switchTab('search');
  searchQuery = tag;
  setTimeout(function() { renderSearchPage(); }, 50);
}
function setSearchFilter(f) { searchFilter = f; renderSearchPage(); }
function setSearchCat(v) { searchCat = v; runSearch(); }
function setSearchGenre(v) { searchGenre = v; runSearch(); }
function runSearch() {
  var area = document.getElementById('search-results-area');
  if (!area) return;
  var q = searchQuery.trim().toLowerCase();
  if (!q && !searchCat && !searchGenre) { area.innerHTML = '<div class="no-results"><i class="ti ti-search"></i><p>キーワードを入力して検索してみよう</p></div>'; return; }
  var matchedTracks = [];
  if (searchFilter !== 'user') {
    for (var i = 0; i < tracks.length; i++) {
      var t = tracks[i];
      var inCat = !searchCat || t.cat === searchCat;
      var inQ = !q || t.name.toLowerCase().indexOf(q) >= 0 || (t.uploader && t.uploader.toLowerCase().indexOf(q) >= 0) || (t.tags && t.tags.toLowerCase().indexOf(q) >= 0) || (t.description && t.description.toLowerCase().indexOf(q) >= 0);
      if (inCat && inQ) matchedTracks.push(t);
    }
  }
  var matchedUsers = [];
  if (searchFilter !== 'track' && user) {
    var uMatch = !q || user.name.toLowerCase().indexOf(q) >= 0 || (user.bio && user.bio.toLowerCase().indexOf(q) >= 0);
    if (uMatch) matchedUsers.push(user);
  }
  if (!matchedTracks.length && !matchedUsers.length) { area.innerHTML = '<div class="no-results"><i class="ti ti-mood-sad"></i><p>「' + searchQuery + '」の結果は見つかりませんでした</p></div>'; return; }
  var html = '';
  if (matchedUsers.length) {
    html += '<div class="search-section-lbl"><i class="ti ti-user" style="font-size:11px"></i>ユーザー</div>';
    for (var i = 0; i < matchedUsers.length; i++) {
      var u = matchedUsers[i];
      var mc = 0; for (var j = 0; j < tracks.length; j++) if (tracks[j].uploader === u.name) mc++;
      var isF = isFollowing(u.name);
      html += '<div class="user-result">' +
        '<div class="user-result-av">' + (u.avatarUrl ? '<img src="' + u.avatarUrl + '">' : '<i class="ti ti-user" style="font-size:16px;color:#ccc"></i>') + '</div>' +
        '<div style="flex:1;min-width:0;cursor:pointer" onclick="switchTab(\'user\')">' +
          '<div style="font-size:13px;font-weight:500">' + u.name + '</div>' +
          '<div style="font-size:11px;color:#999">' + (u.bio||'自己紹介なし') + '</div>' +
          '<div style="font-size:10px;color:#bbb;margin-top:2px">' + mc + '曲投稿</div>' +
        '</div>' +
        (user && u.name !== user.name ? '<button onclick="toggleFollow(\'' + u.name + '\')" class="follow-btn ' + (isF?'following':'not-following') + '">' + (isF?'<i class="ti ti-user-check"></i>フォロー中':'<i class="ti ti-user-plus"></i>フォロー') + '</button>' : '') +
        '</div>';
    }
  }

function playTrack(i) {
  if (currentIdx === i) { togglePlay(); return; }
  currentIdx = i; var t = tracks[i];
  if (!plays[t.id]) plays[t.id] = {daily:0, weekly:0, monthly:0, yearly:0, alltime:0};
  plays[t.id].daily++; plays[t.id].weekly++; plays[t.id].monthly++; plays[t.id].yearly++; plays[t.id].alltime++;
  // Supabaseに再生履歴を保存
  if (currentAuthUser) { sb.from('play_counts').insert({ track_id: t.id }); }
  var videoWrap = document.getElementById('video-player-wrap');
  var videoEl = document.getElementById('video-player');
  var ytId = t.youtubeUrl ? extractYoutubeId(t.youtubeUrl) : '';
  if (ytId) {
    // YouTube再生
    audio.pause(); audio.src = '';
    videoEl.pause(); videoEl.src = '';
    videoEl.style.display = 'none';
    var ytFrame = document.getElementById('yt-embed-frame');
    if (!ytFrame) {
      ytFrame = document.createElement('iframe');
      ytFrame.id = 'yt-embed-frame';
      ytFrame.width = '100%'; ytFrame.height = '240';
      ytFrame.frameBorder = '0'; ytFrame.allowFullscreen = true;
      ytFrame.allow = 'autoplay; encrypted-media';
      videoWrap.appendChild(ytFrame);
    }
    ytFrame.style.display = 'block';
    ytFrame.src = 'https://www.youtube.com/embed/' + ytId + '?autoplay=1';
    videoWrap.classList.add('show');
    document.querySelector('.main').style.paddingTop = '256px';
  } else if (t.isVideo) {
    audio.pause(); audio.src = '';
    var ytFrame2 = document.getElementById('yt-embed-frame');
    if (ytFrame2) { ytFrame2.src = ''; ytFrame2.style.display = 'none'; }
    videoEl.style.display = 'block';
    videoEl.src = t.url; videoEl.play();
    videoWrap.classList.add('show');
    document.querySelector('.main').style.paddingTop = '256px';
  } else {
    var ytFrame3 = document.getElementById('yt-embed-frame');
    if (ytFrame3) { ytFrame3.src = ''; ytFrame3.style.display = 'none'; }
    videoEl.pause(); videoEl.src = '';
    videoWrap.classList.remove('show');
    document.querySelector('.main').style.paddingTop = '';
    audio.src = t.url; audio.play();
  }
  document.getElementById('p-title').textContent = t.name;
  document.getElementById('p-artist').textContent = catInfo(t.cat).label + (t.uploader ? ' · ' + t.uploader : '');
  var pThumb = document.getElementById('p-thumb');
  pThumb.innerHTML = t.thumbUrl ? '<img src="' + t.thumbUrl + '" style="width:40px;height:40px;object-fit:cover">' : '<i class="ti ti-' + (t.isVideo ? 'video' : 'music') + '"></i>';
  document.getElementById('main-play-btn').innerHTML = '<i class="ti ti-player-pause"></i>';
  renderTracks(); renderRanking(); renderPlaylist(); renderUserPage();
}
function togglePlay() {
  if (!tracks.length) return;
  if (currentIdx < 0) { playTrack(0); return; }
  var t = tracks[currentIdx];
  var videoEl = document.getElementById('video-player');
  if (t && t.isVideo) {
    if (videoEl.paused) { videoEl.play(); document.getElementById('main-play-btn').innerHTML = '<i class="ti ti-player-pause"></i>'; }
    else { videoEl.pause(); document.getElementById('main-play-btn').innerHTML = '<i class="ti ti-player-play"></i>'; }
  } else {
    if (audio.paused) { audio.play(); document.getElementById('main-play-btn').innerHTML = '<i class="ti ti-player-pause"></i>'; }
    else { audio.pause(); document.getElementById('main-play-btn').innerHTML = '<i class="ti ti-player-play"></i>'; }
  }
  renderTracks(); renderUserPage();
}
function prevTrack() { if (tracks.length) playTrack((currentIdx - 1 + tracks.length) % tracks.length); }
function nextTrack() { if (tracks.length) playTrack((currentIdx + 1) % tracks.length); }

      '</div>';
    }
    html += '</div>';
  }
  view.innerHTML = html;
}

function renderMyListDetail(view, listId) {
  var ml = null;
  for (var i = 0; i < MY_LISTS.length; i++) if (MY_LISTS[i].id === listId) { ml = MY_LISTS[i]; break; }
  if (!ml) { myListView = 'list'; renderMyList(); return; }

  var listTracks = [];
  for (var i = 0; i < (ml.trackIds||[]).length; i++) {
    for (var j = 0; j < tracks.length; j++) {
      if (tracks[j].id === ml.trackIds[i]) { listTracks.push(tracks[j]); break; }
    }
  }

  var html = '<div class="mylist-detail-header">' +
    '<button class="mylist-back-btn" onclick="myListView=\'list\';renderMyList()"><i class="ti ti-arrow-left"></i></button>' +
    '<span class="mylist-detail-icon">' + (ml.icon||'🎵') + '</span>' +
    '<div><div class="mylist-detail-name">' + esc(ml.name) + '</div><div class="mylist-detail-count">' + listTracks.length + '曲</div></div>' +
    '<button class="mylist-card-btn" onclick="openListEdit(\'' + ml.id + '\')" style="font-size:16px;color:#888"><i class="ti ti-edit"></i></button>' +
  '</div>';

  if (!listTracks.length) {
    html += '<div class="empty"><i class="ti ti-music-off"></i><p>このリストはまだ空です<br><span style="font-size:11px;color:#bbb">曲の「+」ボタンからリストに追加できます</span></p></div>';
  } else {
    html += '<div class="track-list">';
    for (var i = 0; i < listTracks.length; i++) {
      var t = listTracks[i];
      var tIdx = tracks.indexOf(t);
      var ci = catInfo(t.cat);
      var playing = currentIdx === tIdx;
      html += '<div class="track-row' + (playing ? ' playing' : '') + '" id="track-ml-' + t.id + '" onclick="playTrack(' + tIdx + ')">' +
        '<div class="track-thumb">' + thumbHtml(t, 44) + (playing ? '<div class="thumb-play-ov"><i class="ti ti-player-' + (!audio.paused ? 'pause' : 'play') + '"></i></div>' : '') + '</div>' +
        '<div class="track-info">' +
          '<div class="track-name">' + esc(t.name) + '</div>' +
          '<div class="track-meta"><span class="cat-badge" style="background:' + ci.bg + ';color:' + ci.color + '">' + ci.label + '</span>' + (t.duration ? fmtTime(t.duration) : '') + '</div>' +
        '</div>' +
        '<button class="icon-btn" style="color:#e24b4a" title="リストから削除" onclick="event.stopPropagation();removeFromMyList(\'' + ml.id + '\',\'' + t.id + '\')"><i class="ti ti-x"></i></button>' +
        '<button class="icon-btn" onclick="event.stopPropagation();playTrack(' + tIdx + ')"><i class="ti ti-player-play"></i></button>' +
      '</div>';
    }
    html += '</div>';
  }
  view.innerHTML = html;
}

function openMyListDetail(id) { myListView = id; renderMyList(); }

function openListEdit(id) {
  listEditId = id;
  var ml = null;
  if (id) for (var i = 0; i < MY_LISTS.length; i++) if (MY_LISTS[i].id === id) { ml = MY_LISTS[i]; break; }
  var modal = document.getElementById('list-edit-modal');
  document.getElementById('list-edit-modal-title').textContent = id ? 'リストを編集' : '新しいリストを作成';
  document.getElementById('list-edit-name').value = ml ? ml.name : '';
  // アイコン選択UI
  var iconsHtml = '';
  var selectedIcon = ml ? ml.icon : LIST_ICONS[0];
  for (var i = 0; i < LIST_ICONS.length; i++) {
    iconsHtml += '<button class="list-edit-icon-btn' + (LIST_ICONS[i] === selectedIcon ? ' selected' : '') + '" onclick="selectListIcon(this,\'' + LIST_ICONS[i] + '\')">' + LIST_ICONS[i] + '</button>';
  }
  document.getElementById('list-edit-icons').innerHTML = iconsHtml;
  modal.classList.add('open');
  setTimeout(function(){ document.getElementById('list-edit-name').focus(); }, 100);
}
function closeListEdit() { document.getElementById('list-edit-modal').classList.remove('open'); }
function selectListIcon(btn, icon) {
  var btns = document.querySelectorAll('.list-edit-icon-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('selected');
  btn.classList.add('selected');
}
function getSelectedIcon() {
  var btn = document.querySelector('.list-edit-icon-btn.selected');
  return btn ? btn.textContent : LIST_ICONS[0];
}
function saveList() {
  var name = document.getElementById('list-edit-name').value.trim();
  if (!name) { document.getElementById('list-edit-name').focus(); showToast('リスト名を入力してください'); return; }
  var icon = getSelectedIcon();
  if (listEditId) {
    for (var i = 0; i < MY_LISTS.length; i++) {
      if (MY_LISTS[i].id === listEditId) { MY_LISTS[i].name = name; MY_LISTS[i].icon = icon; break; }
    }
    showToast('リストを更新しました');
  } else {
    MY_LISTS.push({ id: 'ml_' + Date.now(), name: name, icon: icon, trackIds: [] });
    showToast('リストを作成しました！');
  }
  saveMyLists();
  closeListEdit();
  renderMyList();
}
function deleteMyList(id) {
  if (!confirm('このリストを削除しますか？')) return;
  MY_LISTS = MY_LISTS.filter(function(ml){ return ml.id !== id; });
  saveMyLists();
  if (myListView === id) myListView = 'list';
  renderMyList();
  showToast('リストを削除しました');
}
function removeFromMyList(listId, trackId) {
  for (var i = 0; i < MY_LISTS.length; i++) {
    if (MY_LISTS[i].id === listId) {
      MY_LISTS[i].trackIds = MY_LISTS[i].trackIds.filter(function(tid){ return tid !== trackId; });
      break;
    }
  }
  saveMyLists();
  renderMyList();
  showToast('リストから削除しました');
}

/* リスト選択モーダル（曲の＋ボタンから） */
function openListSelect(trackId) {
  if (!currentAuthUser) { showToast('ログインが必要です'); return; }
  listSelectTrackId = trackId;
  var t = null; for (var i = 0; i < tracks.length; i++) if (tracks[i].id === trackId) { t = tracks[i]; break; }
  document.getElementById('list-select-title').textContent = (t ? '「' + t.name + '」を追加' : 'リストに追加');
  renderListSelectBody(trackId);
  document.getElementById('list-select-modal').classList.add('open');
}
function closeListSelect() { document.getElementById('list-select-modal').classList.remove('open'); listSelectTrackId = null; }
function renderListSelectBody(trackId) {
  var body = document.getElementById('list-select-body');
  if (!MY_LISTS.length) {
    body.innerHTML = '<div style="text-align:center;padding:1rem;color:#bbb;font-size:12px">リストがありません</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < MY_LISTS.length; i++) {
    var ml = MY_LISTS[i];
    var already = ml.trackIds && ml.trackIds.indexOf(trackId) >= 0;
    html += '<div class="list-select-item' + (already ? ' already' : '') + '" onclick="addToMyList(\'' + ml.id + '\')">' +
      '<span class="list-select-item-icon">' + (ml.icon||'🎵') + '</span>' +
      '<span class="list-select-item-name">' + esc(ml.name) + '</span>' +
      '<span class="list-select-item-count">' + (already ? '追加済み' : (ml.trackIds||[]).length + '曲') + '</span>' +
    '</div>';
  }
  body.innerHTML = html;
}
function addToMyList(listId) {
  if (!listSelectTrackId) return;
  for (var i = 0; i < MY_LISTS.length; i++) {
    if (MY_LISTS[i].id === listId) {
      if (!MY_LISTS[i].trackIds) MY_LISTS[i].trackIds = [];
      if (MY_LISTS[i].trackIds.indexOf(listSelectTrackId) < 0) {
        MY_LISTS[i].trackIds.push(listSelectTrackId);
        saveMyLists();
        showToast('「' + MY_LISTS[i].name + '」に追加しました！');
        closeListSelect();
        if (myListView === listId) renderMyList();
      } else {
        showToast('すでにこのリストに追加済みです');
      }
      break;
    }
  }
}

function renderPlaylist() { renderMyList(); } // 後方互換
function addToPlaylist(id) { openListSelect(id); } // ＋ボタン → リスト選択へ

var plCat = '', plGenre = '';
function setPlCat(v) { plCat = v; }
function setPlGenre(v) { plGenre = v; }
function switchTab(tab) {
  var tabIds = {feed:'tab-feed',ranking:'tab-ranking',playlist:'tab-playlist-inline',user:'tab-user',search:'tab-search'};
  var allTabs = document.querySelectorAll('.tab-content');
  for (var i = 0; i < allTabs.length; i++) allTabs[i].classList.remove('active');
  var navBtns = document.querySelectorAll('.bottom-nav button');
  for (var i = 0; i < navBtns.length; i++) navBtns[i].classList.remove('active');
  if (tabIds[tab]) document.getElementById(tabIds[tab]).classList.add('active');
  var bBtn = document.getElementById('bnav-' + tab);
  if (bBtn) bBtn.classList.add('active');
  document.getElementById('comments-panel').classList.remove('open');
  document.getElementById('notif-panel').classList.remove('open');
  notifOpen = false;
  if (tab === 'ranking') renderRanking();
  if (tab === 'playlist') renderMyList();
  if (tab === 'user') renderUserPage();
  if (tab === 'search') renderSearchPage();
}
function showToast(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 5000);
}
function onDragOver(e) { e.preventDefault(); var z = document.getElementById('upload-zone'); if (z) z.classList.add('drag'); }
function onDragLeave() { var z = document.getElementById('upload-zone'); if (z) z.classList.remove('drag'); }
function onDrop(e) { e.preventDefault(); var z = document.getElementById('upload-zone'); if (z) z.classList.remove('drag'); onFileSelect(e.dataTransfer.files); }

var mos = document.querySelectorAll('.modal-overlay');
for (var i = 0; i < mos.length; i++) {
  mos[i].addEventListener('click', function(e){ if (e.target === this) this.classList.remove('open'); });
}

renderUploadArea(); renderTracks(); renderRanking(); renderFilterBar(); renderUserPage();
loadMyLists(); renderMyList();
</script>
